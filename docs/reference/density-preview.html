<meta name="claude:viewport-fit-sides" content="cover">
<title>Pulse default and compact views</title>
<style>
/* LAYOUT: a fixed stage (panel at real size above a tray bar) with a view switch on top, beside (sideways) or above (upright) a scrolling list of grouped options. The page itself never scrolls. */
:root{color-scheme:light;
  --pg:#eef1ef;--card:#ffffff;--pink:#0d0f0e;--pmute:#56605b;--pline:#dfe4e1;--wall:#d5dfd9;--bar:#f7f9f8;--pick:#0f6f40;--pickbg:#e3f8ec;--warn:#b23c0b;
  --bg:#ffffff;--ink:#0d0f0e;--mute:#5b625f;--line:#e4e7e5;--soft:#f2f4f3;--heroBg:#b8f5d0;--heroInk:#0d0f0e;--hot:#c2410c;--mint:#b8f5d0;--busy:#1f9d5c;--idle:#9aa39f;
  --display:"Space Grotesk","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--text:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --pg:#080a09;--card:#121513;--pink:#f1f4f2;--pmute:#9aa39f;--pline:#262c29;--wall:#1b221e;--bar:#101412;--pick:#b8f5d0;--pickbg:#12231a;--warn:#ff9b6b;
  --bg:#0d0f0e;--ink:#f1f4f2;--mute:#98a19d;--line:#232926;--soft:#161a18;--heroBg:#12231a;--heroInk:#b8f5d0;--hot:#ff9b6b;--busy:#4ade80;--idle:#5d6662}}
:root[data-theme="dark"]{color-scheme:dark;
  --pg:#080a09;--card:#121513;--pink:#f1f4f2;--pmute:#9aa39f;--pline:#262c29;--wall:#1b221e;--bar:#101412;--pick:#b8f5d0;--pickbg:#12231a;--warn:#ff9b6b;
  --bg:#0d0f0e;--ink:#f1f4f2;--mute:#98a19d;--line:#232926;--soft:#161a18;--heroBg:#12231a;--heroInk:#b8f5d0;--hot:#ff9b6b;--busy:#4ade80;--idle:#5d6662}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{touch-action:manipulation;margin:0;background:var(--pg);color:var(--pink);font:14px/1.45 var(--text);overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--pick);outline-offset:2px;border-radius:8px}
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;max-width:1100px;margin:0 auto}
.head{display:flex;align-items:flex-start;gap:10px}
.head>div{flex:1}
.head h1{margin:0;font:700 18px/1.15 var(--display);text-wrap:balance}
.head p{margin:2px 0 0;font-size:13px;color:var(--pmute)}
.theme{flex:none;border:1px solid var(--pline);background:var(--card);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;min-height:34px}
.body{display:grid;grid-template-rows:minmax(0,60%) minmax(0,1fr);gap:10px}
.left{display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}

/* view bar and stage */
.sbar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:hidden}
.vseg{flex:none;display:flex;background:var(--card);border:1px solid var(--pline);border-radius:8px;padding:2px}
.vseg button{font-size:13px;padding:4px 10px;border-radius:6px;color:var(--pmute);min-height:30px;font-weight:500}
.vseg [aria-pressed=true]{background:var(--pink);color:var(--pg);font-weight:600}
.read{font-size:12.5px;font-weight:600;white-space:nowrap;flex:1;display:flex;gap:6px;align-items:baseline;overflow:hidden}
.read .rn{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.read small{font-weight:400;color:var(--pmute);flex:none}
.stage{position:relative;overflow:hidden;border-radius:14px;background:var(--wall);border:1px solid var(--pline)}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:36px;background:var(--bar);border-top:1px solid var(--pline);display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 8px;z-index:3}
.taskbar .hint{margin-right:auto;font-size:12px;color:var(--pmute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taskbar .clock{font-size:11px;line-height:1.15;text-align:right;color:var(--pmute);flex:none}
#tray{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center}
#tray:hover{background:var(--pline)}
.holder{position:absolute;right:10px;bottom:46px;transform-origin:bottom right;transform:scale(var(--s,1));transition:opacity .12s;z-index:2}
.holder[data-open="0"]{opacity:0;pointer-events:none}

/* options */
.opts{overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
.grp{display:flex;flex-direction:column;gap:6px}
.gh{padding:4px 2px 0}
.gh h2{margin:0;font:700 15px/1.25 var(--display)}
.gh p{margin:2px 0 0;font-size:13px;color:var(--pmute)}
.rec{background:var(--pickbg);color:var(--pick);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.4}
.rec b{font-weight:700}
.opt{background:var(--card);border:1px solid var(--pline);border-radius:12px;padding:9px 12px;cursor:pointer;display:grid;gap:4px}
.opt[aria-pressed=true]{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.ot{display:flex;align-items:center;gap:8px}
.ot h3{margin:0;font:700 14.5px/1.2 var(--display);flex:1}
.tag{font-size:11.5px;font-weight:600;background:var(--pickbg);color:var(--pick);border-radius:5px;padding:2px 6px;white-space:nowrap}
.star{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--pmute);flex:none}
.star:hover{background:var(--pg)}
.star[aria-pressed=true]{color:var(--pick)}
.star[aria-pressed=true] path{fill:currentColor}
.opt .d{margin:0;font-size:13px;color:var(--pmute)}
.opt .px{margin:0;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.opt .px small{font-weight:400;color:var(--pmute);font-size:12px}
.picks{background:var(--card);border:1px solid var(--pline);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.picks p{margin:0;font-size:13px}
.picks button{background:var(--pink);color:var(--pg);font-weight:600;border-radius:8px;padding:8px 14px;min-height:38px;justify-self:start}
.credit{margin:0;padding:0 2px 6px;font-size:12px;line-height:1.4;color:var(--pmute)}
.picks textarea{width:100%;font:13px/1.4 var(--text);border:1px solid var(--pline);border-radius:8px;padding:8px;background:var(--pg);color:var(--pink);resize:none}

@media (min-width:700px),(orientation:landscape){
  .body{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) minmax(280px,400px)}
}
@media (orientation:landscape) and (max-height:480px){
  body{padding-block:6px}
  .wrap{gap:4px}
  .head p{display:none}
  .head h1{font-size:15px;padding-top:6px}
  .theme{min-height:28px;padding:3px 8px;font-size:12px}
  .body{grid-template-columns:minmax(0,1fr) minmax(250px,46%)}
  .vseg button{min-height:26px;padding:2px 8px;font-size:12px}
  .taskbar{height:28px}
  #tray{width:24px;height:24px}
  .holder{bottom:36px}
}
@media (orientation:landscape) and (max-height:340px),(max-width:430px){.read .rn{display:none}}
@media (orientation:landscape) and (max-height:340px){.read .dm{display:none}.read small::before{content:"shown "}}
@media (max-height:700px) and (orientation:portrait){.head p{display:none}}

/* the Pulse panel, drawn from data. Defaults are today's values. */
.pulse{position:relative;display:flex;flex-direction:column;width:var(--pw);height:var(--ph);max-height:var(--pmax);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.22);font:14px/1.45 var(--text)}
.pulse button{cursor:pointer}
.pulse .top{padding:var(--hp);display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;flex:none;user-select:none}
.pulse .top.slim{grid-template-columns:1fr auto}
.pulse .brand{display:flex;align-items:center;gap:8px;font:700 var(--brand)/1 var(--display);min-width:0;white-space:nowrap}
.pulse .brand svg{width:calc(var(--brand) + 5px);height:calc(var(--brand) + 5px);flex:none}
.pulse .brand .nums{font-variant-numeric:tabular-nums}
.pulse .brand .nums span{color:var(--mute);font-weight:500;font-size:.8em}
.pulse .ctl{display:flex;gap:2px;position:relative}
.pulse .ib{width:var(--ib);height:var(--ib);display:grid;place-items:center;border-radius:8px;color:var(--mute)}
.pulse .ib:hover{background:var(--soft);color:var(--ink)}
.pulse .ib.on{background:var(--soft);color:var(--ink)}
.pulse .status{grid-column:1/-1;margin:0;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse .status::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:#2fbf71}
.pulse .pop{position:absolute;right:8px;top:calc(var(--ib) + 12px);z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:grid;gap:6px;font-size:12.5px;color:var(--mute)}
.pulse main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:var(--mainP)}
.pulse .duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:none}
.pulse .hero{background:var(--heroBg);color:var(--heroInk);border-radius:14px;padding:var(--heroP);display:flex;flex-direction:column;gap:2px}
.pulse .hero.mem{background:var(--soft);color:var(--ink)}
.pulse .lab{font-size:13px;font-weight:600;opacity:.75}
.pulse .big{font:700 var(--big)/1.05 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pulse .fig{position:relative;height:var(--fig);margin-top:4px}
.pulse .sp{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.pulse .sp .a{fill:currentColor;opacity:.16}
.pulse .sp .l{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.pulse .sub{font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* compact tiles and strip */
.pulse .mt{background:var(--heroBg);color:var(--heroInk);border-radius:10px;padding:6px 9px;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:8px;align-items:center}
.pulse .mt.mem{background:var(--soft);color:var(--ink)}
.pulse .mt .lab{font-size:11.5px;line-height:1.2}
.pulse .mt .big{font-size:22px}
.pulse .mt .fig{height:28px;margin:0}
.pulse .strip{background:var(--soft);border-radius:10px;padding:6px 9px 7px;flex:none}
.pulse .strip .row{display:flex;align-items:baseline;gap:4px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.pulse .strip b{font:700 18px/1.1 var(--display);letter-spacing:-.01em}
.pulse .strip em{font-style:normal;font-size:12px;color:var(--mute)}
.pulse .strip .dotsep{color:var(--mute);padding:0 2px}
.pulse .dual{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pulse .pbar{height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.pulse .pbar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.pulse .tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:var(--gap);flex:none}
.pulse .tile{background:var(--soft);border-radius:12px;padding:var(--tileP)}
.pulse .k{font-size:13px;color:var(--mute);font-weight:500}
.pulse .v{font:700 var(--tv)/1.2 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.pulse .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse .tile .pbar{height:5px;margin-top:7px}
.pulse .apps{margin-top:var(--gap);flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.pulse .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex:none;gap:6px}
.pulse .ah h2{margin:0;font:600 var(--fs)/1 var(--text)}
.pulse .seg{display:flex;background:var(--soft);border-radius:8px;padding:2px}
.pulse .seg button{font-size:var(--sfs);padding:4px 9px;border-radius:6px;color:var(--mute);min-height:26px}
.pulse .seg [aria-pressed=true]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pulse .lst{list-style:none;margin:0;padding:0;overflow-y:auto;scrollbar-width:thin;flex:1 1 auto;min-height:0}
.pulse .li{display:grid;grid-template-columns:var(--ic) minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:var(--rp) 2px;border-bottom:1px solid var(--line);font-size:var(--fs)}
.pulse .li.bar{grid-template-columns:var(--ic) minmax(0,1fr) var(--barw) auto;gap:8px}
.pulse .li.plain{gap:8px}
.pulse .li .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.pulse .val .m{color:var(--mute);font-weight:400}
.pulse .li.two .ic{grid-row:span 2}
.pulse .li .sb{grid-column:2/-1;display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:var(--sfs);color:var(--mute)}
.pulse .li .sb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse .br{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.pulse .br i{display:block;height:100%;background:var(--ink);border-radius:3px}
.pulse .li.bar .br{height:4px}
.pulse .ic{width:var(--ic);height:var(--ic);border-radius:calc(var(--ic) / 4);display:grid;place-items:center;font:700 .85em/1 var(--text);color:#fff;flex:none;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.pulse .ic svg{width:64%;height:64%;fill:#fff}
.pulse .sr .ic{width:var(--sic);height:var(--sic);border-radius:5px;font-size:11px}
.pulse .sr{display:grid;grid-template-columns:var(--sic) minmax(0,1fr) auto;gap:8px;align-items:center;padding:var(--sp) 2px var(--sp) calc(var(--ic) - var(--sic) + 2px);font-size:var(--sfs)}
.pulse .sr.d1{padding-left:calc(var(--ic) - var(--sic) + 18px)}
.pulse .sr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse .sr .nm .x{color:var(--mute)}
.pulse .sr .nm .sbt{color:var(--mute);margin-left:6px;font-size:.92em}
.pulse .sr .val{font-weight:500;color:var(--mute)}
.pulse .sr .val b{color:var(--ink);font-weight:600}
.pulse .sr.gh2{padding-top:calc(var(--sp) + 3px)}
.pulse .sr.gh2 .nm{font-weight:600;color:var(--ink)}
.pulse .sr .fold{width:var(--sic);height:var(--sic);display:grid;place-items:center;color:var(--mute)}
.pulse .sr .fold svg{width:15px;height:15px}
.pulse .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--idle);margin-right:6px;vertical-align:1px}
.pulse .dot.on{background:var(--busy)}
.pulse .badge{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 5px;margin-left:6px;background:var(--mint);color:#0d0f0e}
.pulse .wh{display:grid;grid-template-columns:var(--ic) minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:var(--rp) 2px;width:100%;text-align:left;font-size:var(--fs);border-bottom:1px solid var(--line)}
.pulse .wh .tx{display:flex;flex-direction:column;min-width:0}
.pulse .wh .tx b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse .wh .tx span{color:var(--mute);font-size:var(--sfs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse .wh.inline .tx{flex-direction:row;gap:6px;align-items:baseline}
.pulse .wh.inline .tx b{flex:none}
.pulse .wh .chev{width:18px;height:18px;display:grid;place-items:center;color:var(--mute);transition:transform .15s}
.pulse .wh .chev.up{transform:rotate(180deg)}
.pulse .more{display:block;width:100%;text-align:left;padding:var(--sp) 2px var(--sp) calc(var(--ic) + 8px);font-size:var(--sfs);color:var(--pick);font-weight:600}
.pulse .foot{padding:var(--footP);border-top:1px solid var(--line);font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex:none}
.pulse .foot.row{justify-content:flex-start;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;font-variant-numeric:tabular-nums}
.pulse .foot.row b{color:var(--ink);font-weight:600}
.pulse kbd{font:600 12.5px var(--text);background:var(--soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink)}
#meas{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;z-index:-1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <h1>Pulse panel: density and layout</h1>
      <p>Tap an option to see it. Star what you want to keep.</p>
    </div>
    <button class="theme" id="theme" type="button">Dark</button>
  </header>
  <div class="body">
    <div class="left">
      <div class="sbar">
        <div class="vseg" role="group" aria-label="Which view the panel shows">
          <button type="button" data-view="expanded" aria-pressed="false">Expanded</button>
          <button type="button" data-view="compact" aria-pressed="true">Compact</button>
        </div>
        <div class="read" id="read"></div>
      </div>
      <section class="stage" id="stage" aria-label="Preview of the panel above the tray">
        <div class="holder" id="holder" data-open="1"><div class="pulse" id="pulse"></div></div>
        <div class="taskbar">
          <span class="hint" id="hint"></span>
          <button id="tray" type="button" aria-label="Tray icon: hide or show the panel"><svg width="22" height="22" viewBox="0 0 256 256" aria-hidden="true"><rect x="16" y="16" width="224" height="224" rx="52" fill="#0d0f0e"/><path d="M50 140h42l20-52 28 94 20-62 14 20h32" fill="none" stroke="#b8f5d0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <span class="clock">9:41 AM<br>11/25/2026</span>
        </div>
      </section>
    </div>
    <section class="opts" id="opts" aria-label="Options"></section>
  </div>
</div>
<div id="meas" aria-hidden="true"><div class="pulse" id="measp"></div></div>

<script>

  if (r.state) {
    if (dense) { const lead = r.state === 'idle' ? 'idle' : PC(r.cpu); return m ? `${lead} · <b>${MB(r.mem)}</b>` : `<b>${lead}</b> · ${MB(r.mem)}`; }
    return m ? `${r.state} ${PC(r.cpu)} · <b>${MB(r.mem)}</b>` : `${r.state} <b>${PC(r.cpu)}</b> · ${MB(r.mem)}`;
  }
  return m ? MB(r.mem) : PC(r.cpu);
}
function subRow(r, P, dense) {
  if (r.grp) return `<li class="sr gh2"><span class="fold">${FOLDER}</span><span class="nm">${esc(r.name)}</span><span class="val">${valHTML(r, P, dense)}</span></li>`;
  const dot = r.state ? `<i class="dot ${r.state === 'busy' ? 'on' : ''}"></i>` : '';
  const badge = r.agent && !r.state ? '<span class="badge">agent</span>' : '';
  const cnt = r.n > 1 && !r.state ? ` <span class="x">×${r.n}</span>` : '';
  const sb = !dense && r.sub ? `<span class="sbt">${esc(r.sub)}</span>` : '';
  return `<li class="sr ${r.depth ? 'd1' : ''}">${mark(r.mark, r.name)}<span class="nm" title="${esc(r.name)}">${dot}${esc(r.name)}${badge}${cnt}${sb}</span><span class="val">${valHTML(r, P, dense)}</span></li>`;
}
function appRow(a, P, max, mode) {
  const m = P.sort === 'm', v = m ? a.mem : a.cpu, w = (v / max * 100).toFixed(1), vs = m ? MB(a.mem) : PC(a.cpu);
  if (mode === 'two') return `<li class="li two">${mark(a.mark, a.name)}<span class="nm">${esc(a.name)}</span><span class="val">${vs}</span><span class="sb"><span>${esc(a.exe)}${a.procs > 1 ? ' · ' + a.procs + ' processes' : ''}</span><span class="br"><i style="width:${w}%"></i></span></span></li>`;
  if (mode === 'bar') return `<li class="li bar">${mark(a.mark, a.name)}<span class="nm">${esc(a.name)}</span><span class="br"><i style="width:${w}%"></i></span><span class="val">${vs}</span></li>`;
  return `<li class="li plain">${mark(a.mark, a.name)}<span class="nm">${esc(a.name)}</span><span class="val">${vs}</span></li>`;
}

/* ---------- the panel as a renderer: panelHTML(P) -> html ---------- */
function panelHTML(P) {
  const L = P.L, m = P.sort === 'm', dense = !!L.compact;
  const used = D.mem.used.toFixed(1) + ' GB';
  // header
  const toggleBtn = P.sw === 'button' ? `<button class="ib" type="button" data-act="view" aria-label="${P.view === 'compact' ? 'Switch to the expanded view' : 'Switch to the compact view'}" title="${P.view === 'compact' ? 'Expanded view' : 'Compact view'}">${P.view === 'compact' ? I_EXPAND : I_SHRINK}</button>` : '';
  const gear = P.sw === 'setting' ? `<button class="ib ${P.settings ? 'on' : ''}" type="button" data-act="gear" aria-label="Settings" aria-expanded="${!!P.settings}">${I_GEAR}</button>` : `<span class="ib" aria-hidden="true">${I_GEAR}</span>`;
  const pop = P.sw === 'setting' && P.settings ? `<div class="pop" role="group" aria-label="Panel view"><span>Panel view</span><div class="seg"><button type="button" data-act="setview" data-v="expanded" aria-pressed="${P.view === 'expanded'}">Expanded</button><button type="button" data-act="setview" data-v="compact" aria-pressed="${P.view === 'compact'}">Compact</button></div></div>` : '';
  const ctl = `<div class="ctl">${toggleBtn}${gear}<button class="ib" type="button" data-act="close" aria-label="Hide the panel">${I_X}</button></div>`;
  let top;
  if (L.hdr === 'big') top = `<div class="top" data-hdr><div class="brand">${LOGO}Pulse</div>${ctl}<p class="status">Sample data, not this PC</p></div>`;
  else if (L.hdr === 'slim') top = `<div class="top slim" data-hdr><div class="brand">${LOGO}Pulse</div>${ctl}</div>`;
  else top = `<div class="top slim" data-hdr><div class="brand">${LOGO}<span class="nums">${D.cpu.pct}% <span>·</span> ${used}</span></div>${ctl}</div>`;
  // heroes
  let hero = '';
  if (L.hero === 'full') hero = `<section class="duo"><div class="hero"><div class="lab">Processor</div><div class="big">${D.cpu.pct}%</div><div class="fig">${spark(D.cpu.hist)}</div><div class="sub">${D.cpu.cores} cores · up ${D.cpu.up}</div></div><div class="hero mem"><div class="lab">Memory</div><div class="big">${used}</div><div class="fig">${spark(D.mem.hist)}</div><div class="sub">of ${D.mem.total} GB · ${Math.round(D.mem.used / D.mem.total * 100)}%</div></div></section>`;
  else if (L.hero === 'mini') hero = `<section class="duo"><div class="mt"><div><div class="lab">Processor</div><div class="big">${D.cpu.pct}%</div></div><div class="fig">${spark(D.cpu.hist)}</div></div><div class="mt mem"><div><div class="lab">Memory</div><div class="big" style="font-size:19px">${used}</div></div><div class="fig">${spark(D.mem.hist)}</div></div></section>`;
  else if (L.hero === 'strip') hero = `<section class="strip"><div class="row"><b>${D.cpu.pct}%</b><em>processor</em><span class="dotsep">·</span><b>${used}</b><em>memory</em></div><div class="dual"><div class="pbar"><i style="width:${D.cpu.pct}%"></i></div><div class="pbar"><i style="width:${Math.round(D.mem.used / D.mem.total * 100)}%"></i></div></div></section>`;
  // apps
  const apps = [...D.apps].sort((a, b) => (m ? b.mem - a.mem : b.cpu - a.cpu)).slice(0, L.top);
  const max = m ? Math.max(1, ...apps.map(a => a.mem), D.wsl.mem) : Math.max(5, ...apps.map(a => a.cpu));
  const seg = `<div class="seg"><button type="button" data-act="sort" data-s="m" aria-pressed="${m}">Memory</button><button type="button" data-act="sort" data-s="c" aria-pressed="${!m}">Processor</button></div>`;
  const ents = entries(P.agent, P.sort, L.w < 380), cnt = wslCounts();
  const wv = m ? MB(D.wsl.mem) : PC(D.wsl.cpu), wmax = m ? max : Math.max(5, ...apps.map(a => a.cpu)), ww = ((m ? D.wsl.mem : D.wsl.cpu) / wmax * 100).toFixed(1);
  let wsl = '';
  const rowsOf = es => es.flatMap(e => e.rows).map(r => subRow(r, P, dense)).join('');
  if (!dense) {
    const head = L.apps === 'two' ? `<li class="li two">${mark(null, 'WSL (Linux)')}<span class="nm">${D.wsl.name}</span><span class="val">${wv}</span><span class="sb"><span>${cnt.programs} programs · ${cnt.agents} agents</span><span class="br"><i style="width:${ww}%"></i></span></span></li>` : `<li class="li bar">${mark(null, 'WSL (Linux)')}<span class="nm">${D.wsl.name} <span style="color:var(--mute);font-weight:400">· ${cnt.programs} programs</span></span><span class="br"><i style="width:${ww}%"></i></span><span class="val">${wv}</span></li>`;
    wsl = head + rowsOf(ents);
  } else {
    const mode = P.wslMode, text = L.wslHead === 'inline' ? `<b>${D.wsl.name}</b><span>· ${cnt.programs} programs · ${cnt.agents} agents</span>` : `<b>${D.wsl.name}</b><span>${cnt.programs} programs · ${cnt.agents} agents</span>`;
    const exp = mode === 'open' || P.wslExp, chev = mode === 'open' ? '<span></span>' : `<span class="chev ${exp ? 'up' : ''}">${CHEV}</span>`;
    const head = `<li><button class="wh ${L.wslHead}" type="button" data-act="wsl" ${mode === 'open' ? 'disabled' : ''} aria-expanded="${exp}">${mark(null, 'WSL (Linux)')}<span class="tx">${text}</span><span class="val">${wv}</span>${chev}</button></li>`;
    let body = '';
    if (mode === 'open' || (mode === 'collapsed' && P.wslExp)) body = rowsOf(ents);
    else if (mode === 'top3') {
      body = P.wslExp ? rowsOf(ents) + `<li><button class="more" type="button" data-act="wsl">Show fewer</button></li>` : rowsOf(ents.slice(0, 3)) + (ents.length > 3 ? `<li><button class="more" type="button" data-act="wsl">+${ents.length - 3} more${ents[0].unit === 'folders' ? ' folders' : ''}</button></li>` : '');
    }
    wsl = head + body;
  }
  const mainApps = `<section class="apps"><div class="ah"><h2>Top apps</h2>${seg}</div><ul class="lst">${apps.map(a => appRow(a, P, max, L.apps === 'two' ? 'two' : L.apps)).join('')}${wsl}</ul></section>`;
  // footer figures
  let tri;
  if (L.tri === 'tiles') tri = `<section class="tri"><div class="tile"><div class="k">Graphics</div><div class="v">${D.gpu}%</div><div class="s">3D engine</div><div class="pbar"><i style="width:${D.gpu}%"></i></div></div><div class="tile"><div class="k">Drive C:</div><div class="v">${D.drive.free}</div><div class="s">free</div><div class="pbar"><i style="width:${D.drive.frac * 100}%"></i></div></div><div class="tile"><div class="k">Network</div><div class="v">↓ ${D.net.down}</div><div class="s">↑ ${D.net.up}</div></div></section>`;
  const foot = L.tri === 'tiles' ? `<footer class="foot"><span><kbd>Alt+Shift+P</kbd> opens and closes Pulse</span><span>2s ago</span></footer>` : `<footer class="foot row"><span>Graphics <b>${D.gpu}%</b></span><span>C: <b>${D.drive.free}</b> free</span><span><b>↓${D.net.down}</b> <b>↑${D.net.up}</b></span></footer>`;
  return `${top}${pop}<main>${hero}${mainApps}${L.tri === 'tiles' ? tri : ''}</main>${foot}`;
}

/* ---------- state ---------- */
const GROUPS = [
  { id: 'g1', title: '1. Default (expanded) view: how tight', blurb: 'Same content in all three. Only paddings, type and heights change. Tap Expanded above to see these.', rec: '<b>My pick: B.</b> About 17% shorter and it reads exactly like today, so there is nothing new to learn. C is shorter again but the second line under each app (the file name and process count) is gone, and you may miss it.', opts: [
    { id: 'today', title: 'A Today', d: 'Exactly as installed: 380 px wide, 700 px tall.' },
    { id: 'tight', title: 'B Tighter', d: 'Same rows and tiles with smaller spacing, type and tile heights.', tag: 'My pick' },
    { id: 'tightc', title: 'C Tight, one-line apps', d: 'Like B, but each app is one line: icon, name, thin bar, number.' }] },
  { id: 'g2', title: '2. Compact view: three candidates', blurb: 'All clearly smaller than B. Graphics, Drive and Network become one footer row (Battery joins it on laptops). Tap Compact above to see these.', rec: '<b>My pick: A.</b> It keeps both little charts and the same 380 width, so it feels like the same panel, just tighter. B drops the charts for a narrow panel that sits beside a window. C is a glance-only panel: it shows two apps and the numbers sit in the header.', opts: [
    { id: 'ca', title: 'A Mini tiles', d: 'Processor and Memory as two half-width tiles with a number and a tiny chart. One-line app rows with a thin bar. 380 px wide.', tag: 'My pick' },
    { id: 'cb', title: 'B One strip', d: 'One line: 24% processor, 13.4 GB memory, with two thin bars under it. One-line app rows. 300 px wide.' },
    { id: 'cc', title: 'C Smallest', d: 'The two numbers live in the header. Two apps, then the footer. 260 px wide.' }] },
  { id: 'g3', title: '3. The Linux part (WSL) in compact view', blurb: 'The arrow works here. Tap the WSL row in the panel to open and close it.', rec: '<b>My pick: collapsed to one row.</b> Compact is for a quick look, and the Linux list is the noisy part. The row still tells you how many programs and agents are running, and it remembers open or closed. Top 3 is the pick if you always want the biggest Linux items in view.', opts: [
    { id: 'collapsed', title: 'Collapsed to one row', d: 'WSL (Linux), the program and agent count, the memory, an arrow. Tap to open everything.', tag: 'My pick' },
    { id: 'top3', title: 'Top 3 inside', d: 'The three biggest Linux items, then "+N more" which opens the rest.' },
    { id: 'open', title: 'Always open', d: 'Every Linux item, always shown. Tallest.' }] },
  { id: 'g4', title: '4. Seeing what agents are doing', blurb: 'Pulse can read, from outside and at no cost: each session on its own, its project folder, processor and memory, how long it has run, busy or idle right now, and the programs it started. It cannot read what an agent is thinking or which step it is on, so none of these shows that. Tapping one opens the Linux list.', rec: '<b>My pick: B, grouped by project folder.</b> It answers "what is each agent doing" best: the dev server or test containers an agent started sit right under it. A is the lighter version and reads well in compact. C is today.', opts: [
    { id: 'lines', title: 'A One line per session', d: 'Claude Code · pulse, busy 2.6%, 260 MB. One row for each session, agents first.' },
    { id: 'grouped', title: 'B Grouped by project folder', d: 'A folder row, then its agents with how long they ran and the programs they started.', tag: 'My pick' },
    { id: 'same', title: 'C Today: "Claude Code ×3"', d: 'Sessions are lumped together by program, as now.' }] },
  { id: 'g5', title: '5. How to switch views', blurb: 'Tap each one, then try it in the panel.', rec: '<b>My pick: the small button in the header.</b> One tap, easy to find, no hidden gesture. A setting alone is the slowest. Double-click can be added later as a shortcut on top of the button, so you can star both.', opts: [
    { id: 'button', title: 'Button in the panel header', d: 'A small arrows icon next to the gear. One tap switches.', tag: 'My pick' },
    { id: 'setting', title: 'Setting only', d: 'Tap the gear in the panel, then Panel view. Nothing else in the header.' },
    { id: 'dblclick', title: 'Double-click the header', d: 'Double-click (or double-tap) the Pulse title bar. No button, no hint in the panel.' }] }
];
const sel = { g1: 'tight', g2: 'ca', g3: 'collapsed', g4: 'grouped', g5: 'button' };
const S = { view: 'compact', sort: 'm', wslExp: false, settings: false, open: true, scrollWsl: false };
const stars = store.get('stars', {});
const P_of = (over = {}) => { const view = over.view || S.view, L = LAYOUTS[over.layout || (view === 'expanded' ? sel.g1 : sel.g2)]; return { L, view, sort: S.sort, agent: sel.g4, wslMode: sel.g3, wslExp: S.wslExp, sw: sel.g5, settings: S.settings, ...over }; };

function paint(el, P) { el.style.cssText = varStr(P.L); el.innerHTML = panelHTML(P); }
function measure(over) {
  const el = $('#measp'); paint(el, P_of(over)); const l = el.querySelector('.lst');
  return { h: el.offsetHeight, w: el.offsetWidth, list: l ? l.scrollHeight : 0, shown: l ? l.clientHeight : 0 };
}

/* ---------- options list ---------- */
const optsEl = $('#opts');
const STAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8z"/></svg>';
optsEl.innerHTML = GROUPS.map(g => `<div class="grp"><div class="gh"><h2>${g.title}</h2><p>${g.blurb}</p></div><div class="rec">${g.rec}</div>${g.opts.map(o => `<article class="opt" tabindex="0" role="button" data-g="${g.id}" data-o="${o.id}" aria-pressed="false"><div class="ot"><h3>${o.title}</h3>${o.tag ? `<span class="tag">${o.tag}</span>` : ''}<button class="star" type="button" data-star="${g.id}.${o.id}" aria-pressed="false" aria-label="Star ${esc(o.title)}: keep this one">${STAR}</button></div><p class="d">${o.d}</p><p class="px" data-px="${g.id}.${o.id}"></p></article>`).join('')}</div>`).join('') +
  `<div class="picks"><p id="pickLine">Star what you want to keep. Unstarred ones are dropped.</p><button type="button" id="copy">Copy my picks</button><textarea id="copyOut" rows="4" readonly hidden aria-label="Your picks, to copy"></textarea></div><p class="credit">The Claude, Next.js, Node.js, Chrome and Docker marks in the sample panel come from Simple Icons (version 16, CC0 1.0). The marks themselves are trademarks of their owners and are used here only to show what the list looks like. Names and numbers in the panel are sample data.</p>`;

function px(id, html) { const e = optsEl.querySelector(`[data-px="${id}"]`); if (e && e.innerHTML !== html) e.innerHTML = html; }
function stats() {
  for (const k of ['today', 'tight', 'tightc']) { const r = measure({ layout: k, view: 'expanded' }); px('g1.' + k, `${r.w} × ${r.h} px <small>${k === 'today' ? 'installed size' : Math.round((1 - r.h / 700) * 100) + '% shorter than today'}</small>`); }
  for (const k of ['ca', 'cb', 'cc']) {
    const a = measure({ layout: k, view: 'compact', wslExp: false }), b = measure({ layout: k, view: 'compact', wslExp: true });
    px('g2.' + k, `${a.w} × ${a.h} px <small>${sel.g3 === 'open' ? '' : 'WSL closed, ' + b.h + ' px with all Linux items'}</small>`);
  }
  const ck = sel.g2;
  px('g3.collapsed', `${measure({ layout: ck, view: 'compact', wslMode: 'collapsed', wslExp: false }).h} px <small>closed, ${measure({ layout: ck, view: 'compact', wslMode: 'collapsed', wslExp: true }).h} px open (${LAYOUTS[ck].name})</small>`);
  px('g3.top3', `${measure({ layout: ck, view: 'compact', wslMode: 'top3', wslExp: false }).h} px <small>top 3, ${measure({ layout: ck, view: 'compact', wslMode: 'top3', wslExp: true }).h} px with all</small>`);
  px('g3.open', `${measure({ layout: ck, view: 'compact', wslMode: 'open' }).h} px <small>always (${LAYOUTS[ck].name})</small>`);
  for (const k of ['lines', 'grouped', 'same']) { const r = measure({ layout: sel.g1, view: 'expanded', agent: k }); px('g4.' + k, `${r.list} px of list <small>${r.shown} px visible, the rest scrolls (${LAYOUTS[sel.g1].name})</small>`); }
  px('g5.button', '<small>adds one 28 to 34 px button to the header</small>'); px('g5.setting', '<small>adds nothing to the header, 2 taps to switch</small>'); px('g5.dblclick', '<small>adds nothing to the header, hidden gesture</small>');
}

/* ---------- stage ---------- */
function fit() {
  const st = $('#stage'), h = $('#holder'), p = $('#pulse'), tb = st.querySelector('.taskbar').offsetHeight, W = st.clientWidth, H = st.clientHeight;
  h.style.setProperty('--s', '1'); const pw = p.offsetWidth, ph = p.offsetHeight;
  const s = Math.min(1, (W - 20) / pw, (H - tb - 18) / ph);
  h.style.setProperty('--s', Math.max(.1, s).toFixed(4)); h.style.bottom = (tb + 10) + 'px';
  const L = P_of().L;
  $('#read').innerHTML = `<span class="rn">${esc(L.name)}</span><small><span class="dm">${pw} × ${ph} px </span>at ${Math.round(s * 100)}%</small>`;
}
function draw() {
  const P = P_of(), p = $('#pulse'), l = p.querySelector('.lst'), keep = l ? l.scrollTop : 0;
  paint(p, P);
  const nl = p.querySelector('.lst');
  if (nl) { if (S.scrollWsl) { const w = nl.querySelector('.wh') || [...nl.children].find(x => x.querySelector('.ic') && /WSL/.test(x.textContent)); nl.scrollTop = w ? w.offsetTop - nl.offsetTop - 4 : keep; S.scrollWsl = false; } else nl.scrollTop = keep; }
  for (const b of document.querySelectorAll('.vseg button')) b.setAttribute('aria-pressed', b.dataset.view === S.view);
  for (const o of optsEl.querySelectorAll('.opt')) o.setAttribute('aria-pressed', sel[o.dataset.g] === o.dataset.o);
  $('#hint').textContent = sel.g5 === 'dblclick' ? 'Double-click the Pulse title bar to switch views' : sel.g5 === 'setting' ? 'Tap the gear, then Panel view' : '';
  $('#holder').dataset.open = S.open ? '1' : '0';
  fit(); stats();
}

/* ---------- interactions ---------- */
const flip = () => { S.view = S.view === 'compact' ? 'expanded' : 'compact'; S.settings = false; };
let lastTap = 0;
$('#pulse').addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t) {
    const a = t.dataset.act;
    if (a === 'view') flip();
    else if (a === 'gear') S.settings = !S.settings;
    else if (a === 'setview') { S.view = t.dataset.v; S.settings = false; }
    else if (a === 'sort') S.sort = t.dataset.s;
    else if (a === 'wsl') S.wslExp = !S.wslExp;
    else if (a === 'close') S.open = false;
    draw(); return;
  }
  if (sel.g5 === 'dblclick' && e.target.closest('[data-hdr]')) { const n = Date.now(); if (n - lastTap < 400) { lastTap = 0; flip(); draw(); } else lastTap = n; }
});
$('#tray').onclick = () => { S.open = !S.open; draw(); };
for (const b of document.querySelectorAll('.vseg button')) b.onclick = () => { S.view = b.dataset.view; S.settings = false; draw(); };
function choose(g, o) {
  sel[g] = o; S.settings = false;
  if (g === 'g1') S.view = 'expanded';
  if (g === 'g2') { S.view = 'compact'; }
  if (g === 'g3') { S.view = 'compact'; S.wslExp = false; }
  if (g === 'g4') { S.wslExp = true; S.scrollWsl = S.view === 'expanded'; }
  if (g === 'g5') S.open = true;
  S.open = true; draw();
}
optsEl.addEventListener('click', e => {
  const st = e.target.closest('.star');
  if (st) { stars[st.dataset.star] = !stars[st.dataset.star]; store.set('stars', stars); picks(); $('#copyOut').hidden = true; $('#copy').textContent = 'Copy my picks'; return; }
  const o = e.target.closest('.opt'); if (o) choose(o.dataset.g, o.dataset.o);
});
optsEl.addEventListener('keydown', e => { const o = e.target.closest('.opt'); if (o && e.target === o && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); choose(o.dataset.g, o.dataset.o); } });

function picks() {
  const lines = []; let any = false;
  for (const g of GROUPS) {
    const keep = g.opts.filter(o => stars[g.id + '.' + o.id]).map(o => o.title), drop = g.opts.filter(o => !stars[g.id + '.' + o.id]).map(o => o.title);
    if (keep.length) any = true;
    lines.push(g.title.replace(/^\d+\. /, '') + '\n  Keep: ' + (keep.join('; ') || 'nothing starred') + '\n  Drop: ' + (drop.join('; ') || 'nothing'));
  }
  for (const b of optsEl.querySelectorAll('.star')) b.setAttribute('aria-pressed', !!stars[b.dataset.star]);
  const n = Object.values(stars).filter(Boolean).length;
  $('#pickLine').textContent = n ? n + ' starred. Starred = keep, unstarred = drop.' : 'Star what you want to keep. Unstarred ones are dropped.';
  return 'Pulse panel density and layout, my picks. Starred = keep, unstarred = drop.\n\n' + lines.join('\n\n');
}
$('#copy').onclick = () => {
  const t = picks(), out = $('#copyOut'), show = () => { out.value = t; out.hidden = false; out.focus(); out.select(); $('#copy').textContent = 'Select and copy the text below'; };
  try { navigator.clipboard.writeText(t).then(() => { $('#copy').textContent = 'Copied'; }, show); } catch { show(); }
};

/* light and dark */
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
const themeLabel = () => { $('#theme').textContent = isDark() ? 'Light' : 'Dark'; };
$('#theme').onclick = () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; themeLabel(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', themeLabel);

new ResizeObserver(fit).observe($('#stage'));
themeLabel(); picks(); draw();
}
</script>
