[package]
name = "pulse-native"
description = "Pulse tray monitor, native shell: the panel drawn by Slint, no webview."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pulse-readings = { path = "../../crates/pulse-readings" }

[target.'cfg(windows)'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "raw-window-handle-06", "unstable-winit-030"] }
tray-icon = { version = "0.27", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[build-dependencies]
slint-build = "1.19"
