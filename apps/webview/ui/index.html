<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pulse" id="pulse">
  <div class="top">
    <div class="brand"><canvas id="logo" width="44" height="44"></canvas>Pulse</div>
    <div class="ctl">
      <span class="ib"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3.7"/></svg></span>
      <button class="ib" id="close" aria-label="Hide the panel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <p id="status">Reading this PC</p>
  </div>
  <main>
    <section class="duo">
      <div class="hero"><div class="lab">Processor</div><div class="big" id="cpu">0%</div><div class="fig"><canvas id="cpuC"></canvas></div><div class="sub" id="cpuS">&nbsp;</div></div>
      <div class="hero mem"><div class="lab">Memory</div><div class="big" id="memV">0 GB</div><div class="fig"><canvas id="memC"></canvas></div><div class="sub" id="memS">&nbsp;</div></div>
    </section>
    <section class="apps">
      <div class="ah"><h2>Top apps</h2><div class="seg"><button data-s="m" aria-pressed="true">Memory</button><button data-s="c" aria-pressed="false">Processor</button></div></div>
      <ul id="list"></ul>
    </section>
    <section class="tri">
      <div class="tile"><div class="k">Graphics</div><div class="v" id="gpuV">0%</div><div class="s" id="gpuS">3D engine</div><div class="pbar"><i id="gpuB"></i></div></div>
      <div class="tile"><div class="k">Drive C:</div><div class="v" id="drvV">0 GB</div><div class="s" id="drvS">free</div><div class="pbar"><i id="drvB"></i></div></div>
      <div class="tile"><div class="k">Network</div><div class="v" id="netV">0</div><div class="s" id="netS">up 0</div></div>
      <div class="tile wide" id="bat" hidden><div class="k">Battery</div><div class="v" id="batV">0%</div><div class="s" id="batS">On battery</div><div class="pbar"><i id="batB"></i></div></div>
    </section>
  </main>
  <footer><span><kbd>Alt+Shift+P</kbd> opens and closes Pulse</span><span id="ago">2s ago</span></footer>
</div>
<script src="app.js"></script>
</body>
</html>
