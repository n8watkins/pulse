[package]
name = "pulse-webview"
description = "Pulse, webview shell: the panel is a web page in a hidden WebView2 window."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
default = ["custom-protocol"]
# Serve the page from the files embedded in the binary.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.1"
png = "0.18.1"
pulse-readings = { path = "../../crates/pulse-readings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
